# Builds the Windows app and publishes it as a GitHub release whenever a
# version tag (v1.0.0, v1.1.0, ...) is pushed.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: build\Release\core_tests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build\Release\cpu_simulator.exe, README.md dist
          Compress-Archive -Path dist\* -DestinationPath cpu-simulator-${{ github.ref_name }}-windows-x64.zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          cpu-simulator-${{ github.ref_name }}-windows-x64.zip
          --title "MIPS Pipeline Simulator ${{ github.ref_name }}"
          --notes-file docs/release-notes.md
